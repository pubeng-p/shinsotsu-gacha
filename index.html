<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M8 50a42 42 0 0 1 84 0z' fill='%23ff5d73' stroke='%232b2d42' stroke-width='6'/%3E%3Cpath d='M8 50a42 42 0 0 0 84 0z' fill='%23fff' stroke='%232b2d42' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{--rb:16px;--ink:#2b2d42;--bg:#fff6e9;--pink:#ff5d73;--yellow:#ffd166;--green:#20c997;--blue:#4dabf7;--purple:#9775fa;--muted:#6c727f;--good:#2b8a3e;--bad:#c92a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif}
body{background-image:radial-gradient(#ffe0bd 1.6px,transparent 1.6px);background-size:18px 18px;min-height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;overflow-x:hidden}
.screen{display:flex;flex-direction:column;gap:12px;padding:12px 14px calc(var(--rb) + 28px + env(safe-area-inset-bottom));min-height:100dvh;animation:fadeIn .25s ease}
/* iPhone Safari: its floating bottom toolbar covers ~90px and steals taps there */
html.ios-safari{--rb:92px}
html.standalone .screen{padding-top:calc(12px + env(safe-area-inset-top))}
.scene{transition:height .25s ease}
.a2hs{text-align:center;font-size:12px;font-weight:900;color:var(--muted);background:#fff;border:2px dashed #ced4da;border-radius:12px;padding:6px 8px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:12px 16px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pink);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.big{font-size:22px;padding:15px}
.btn.small{font-size:14px;padding:6px 11px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.center{text-align:center}
.pulse{animation:pulse 1.3s ease-in-out infinite}
.topbar{display:flex;justify-content:flex-end;gap:8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.muted{color:var(--muted)}

/* title */
.logo{text-align:center;margin-top:4px}
.logo h1{margin:0;font-size:50px;line-height:1.05;color:var(--pink);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:2px}
.logo h1.en{font-size:38px}
.logo .sub{font-weight:900;font-size:15px;margin-bottom:6px}
.machine-wrap{display:flex;justify-content:center;position:relative}
.machine{width:62%;max-width:250px;height:auto;overflow:visible}
.gacha .machine{width:74%;max-width:300px;cursor:pointer}
.machine .cap{animation:bob 1.6s ease-in-out infinite}
.machine.shaking{animation:shake .5s ease 2}
.machine.shaking .cap{animation:jiggle .25s linear infinite}
.handle.turn{animation:turn .8s cubic-bezier(.5,0,.3,1)}
.how{display:flex;align-items:center;justify-content:center;gap:6px}
.how .st{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 6px;width:30%;text-align:center;font-weight:900;font-size:12.5px;box-shadow:0 4px 0 var(--ink)}
.how .st b{display:block;font-size:26px;line-height:1.2}
.how .ar{font-weight:900;font-size:18px}
.company{text-align:center;font-weight:900;color:var(--muted);font-size:13px}
.hint{text-align:center;font-weight:900;font-size:22px}
.screen.gacha{justify-content:center;gap:24px}
.tapme{position:absolute;font-size:44px;animation:tap 1s ease-in-out infinite;pointer-events:none}

/* capsule reveal */
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fadeIn .2s ease}
.overlay.clear{background:transparent}
.capsule{width:180px;height:180px;overflow:visible}
.capsule.drop{animation:capDrop .7s cubic-bezier(.3,1.5,.6,1)}
.capsule.wiggle{animation:wiggle .35s ease 3}
.capsule .cap-top,.capsule .cap-bot{transition:transform .45s cubic-bezier(.3,1.4,.6,1),opacity .45s}
.capsule.open .cap-top{transform:translate(-40px,-70px) rotate(-35deg);opacity:0}
.capsule.open .cap-bot{transform:translate(40px,70px) rotate(25deg);opacity:0}
.burst{position:absolute;width:520px;height:520px;border-radius:50%;opacity:0;pointer-events:none}
.burst.on{animation:burst .7s ease-out forwards}
.rays{position:absolute;inset:-40%;pointer-events:none;animation:spin 12s linear infinite;opacity:.55}

/* grad card */
.gcard{position:relative;padding:14px;overflow:hidden;animation:popIn .45s cubic-bezier(.3,1.5,.6,1)}
.rar{position:absolute;top:10px;left:10px;font-weight:900;font-size:26px;padding:2px 12px;border:3px solid var(--ink);border-radius:12px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;box-shadow:0 3px 0 var(--ink);z-index:2}
.rar.UR{background:linear-gradient(90deg,#ff5d73,#ffd43b,#69db7c,#4dabf7,#9775fa);animation:hue 3s linear infinite}
.portrait{border:3px solid var(--ink);border-radius:16px;display:flex;justify-content:center;align-items:flex-end;height:200px;overflow:hidden;position:relative}
.portrait .av{height:calc(100% - 10px);max-height:190px;width:auto;position:relative;z-index:1}
.gname{font-size:26px;font-weight:900;text-align:center;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;background:#fff}
.chip .flag{border-radius:3px}
.stats{display:grid;gap:7px;margin-top:12px}
.stat{display:grid;grid-template-columns:28px 76px 1fr 30px;align-items:center;gap:6px;font-weight:900;font-size:14px}
.stat .ic{font-size:20px;text-align:center}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#f1f3f5;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.3,1.3,.6,1)}
.stat .v{text-align:right;font-variant-numeric:tabular-nums}

/* wheel */
.wheel-wrap{display:flex;justify-content:center}
.wheel{width:88%;max-width:340px;height:auto}
#wheelRot{transition:transform 3.4s cubic-bezier(.12,.75,.12,1)}
.wres{min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:26px;font-weight:900}
.wres .big{font-size:46px;animation:popIn .4s cubic-bezier(.3,1.5,.6,1)}

/* HUD */
.hud{padding:8px 10px;display:grid;grid-template-columns:54px 1fr;gap:4px 10px;align-items:center;position:sticky;top:6px;z-index:5}
.hud .hh{grid-row:span 2;display:flex}
.hud .head{width:54px;height:54px;border:2.5px solid var(--ink);border-radius:14px;background:#e7f5ff;display:block}
.hud .l1{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:900;font-size:14px;min-width:0}
.hud .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.hud .l1 .badge{flex-shrink:0}
.badge{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-weight:900;font-size:12px;white-space:nowrap;background:#fff}
.money{display:flex;gap:12px;font-weight:900;font-size:13px;white-space:nowrap}
.money b{font-variant-numeric:tabular-nums}
.meters{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{display:flex;align-items:center;gap:4px;font-size:16px}
.meter .bar{flex:1;height:12px}
.prog{grid-column:1/-1;position:relative;height:8px;border-radius:999px;background:#e9ecef;border:2px solid var(--ink);margin-top:2px}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--yellow),var(--pink));border-radius:999px;transition:width .5s}
.bump{animation:bump .5s ease}

/* scene */
.scene{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--ink);aspect-ratio:360/220;background:#fff}
.scene-svg{display:block;width:100%;height:100%}
.yr-flag{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px}
.floaters{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;font-weight:900;font-size:22px;-webkit-text-stroke:1px #fff;paint-order:stroke fill;animation:floatUp 1.6s ease-out forwards;white-space:nowrap}
.ev-title{font-size:clamp(18px,5.6vw,22px);font-weight:900;text-align:center;line-height:1.3;padding:0 4px;animation:popIn .35s ease;line-break:strict;text-wrap:balance}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;text-align:left;gap:8px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:10px 12px;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;animation:slideUp .35s cubic-bezier(.3,1.3,.6,1) backwards}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice .ic{font-size:32px;text-align:center}
.choice>span:nth-child(2){overflow-wrap:anywhere;line-height:1.25}
.chance{font-size:14px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chance.hi{background:#b2f2bb}.chance.mid{background:#ffec99}.chance.lo{background:#ffc9c9}.chance.q{background:#e5dbff}
.choice.end{background:#fff0f6}
.choice .tag{font-size:16px}

/* gauge */
.gauge-box{padding:14px;display:grid;gap:8px;justify-items:center}
.gauge{position:relative;width:100%;height:34px;border:3px solid var(--ink);border-radius:12px;background:#ffc9c9;overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:#8ce99a;border-left:3px dashed var(--ink);border-right:3px dashed var(--ink)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.gauge-lbl{font-weight:900;font-size:18px}
.gauge{height:44px}
.gauge .needle{width:8px;margin-left:-4px;transition:background .15s}
.gauge .needle.hit{background:#2b8a3e;box-shadow:0 0 0 5px #b2f2bb}
.gauge .needle.miss{background:#e03131;box-shadow:0 0 0 5px #ffc9c9}
.tapzone{cursor:pointer;touch-action:manipulation}
.shake-x{animation:shakeX .4s ease}
.streak{text-align:center;font-weight:900;font-size:18px;color:#e8590c;animation:bump .6s ease}
.meter.danger{animation:dangerPulse .7s ease-in-out infinite}
.meter.danger .bar{border-color:#e03131}
.scene.gold{border-color:#f59f00;box-shadow:0 6px 0 #e67700,0 0 0 4px #ffe066,0 0 24px 6px rgba(255,212,59,.7)}
.ssr-tag{position:absolute;bottom:8px;right:8px;background:linear-gradient(90deg,#fab005,#ffe066,#fab005);color:var(--ink);font-weight:900;font-size:13px;padding:3px 10px;border-radius:999px;border:2.5px solid var(--ink);animation:bump 1s ease infinite}
.speed .spd-ic{font-size:56px;line-height:1.2}
.speed .spin-fast{display:inline-block}
.spd{margin:6px 0;font-size:22px;line-height:1.35}
.ttl-card{padding:10px 12px;text-align:center;background:linear-gradient(#fffdf0,#fff3bf);animation:popIn .5s cubic-bezier(.3,1.5,.6,1) .2s backwards}
.ttl-lb{font-size:12px;font-weight:900;color:var(--muted)}
.ttl{font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ttl-ic{font-size:34px}
.report-ov{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.report-box{width:100%;max-width:460px;display:grid;gap:10px;padding-bottom:calc(var(--rb) + 20px + env(safe-area-inset-bottom));margin:0 auto}
.rp-bar{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:18px}
.rp-bar .btn{color:var(--ink)}
.rp-img-wrap{overflow:hidden;padding:0;min-height:200px;display:flex;align-items:center;justify-content:center}
.rp-img{display:block;width:100%;height:auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.report-ov .status{color:#fff}
.lbi.tap{cursor:pointer}
.lbi.tap:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* outcome */
.outcome{padding:12px;display:grid;gap:10px;animation:popIn .35s cubic-bezier(.3,1.4,.6,1)}
.res{font-size:28px;font-weight:900;text-align:center}
.res.ok{color:var(--good)}.res.ng{color:var(--bad)}
.res-txt{text-align:center;font-weight:900;font-size:17px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.d{font-weight:900;font-size:15px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff}
.d.good{background:#d3f9d8}.d.bad{background:#ffe3e3}
.yr-sum{display:flex;justify-content:center;gap:14px;font-weight:900;font-size:14px;border-top:2.5px dashed #ced4da;padding-top:8px;flex-wrap:wrap}
.quiet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qc{text-align:center;font-weight:900;padding:8px 4px}
.qc b{display:block;font-size:30px}
.qc .n{font-size:20px;font-variant-numeric:tabular-nums}
.qc small{font-size:11px;color:var(--muted)}

/* promotion */
.promo{padding:18px;text-align:center;width:100%;max-width:360px;animation:popIn .5s cubic-bezier(.3,1.6,.6,1)}
.promo h2{margin:0;font-size:36px;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.promo .av{height:150px}
.promo .arrow{font-size:26px;line-height:1.1}
.promo .to{font-size:24px;padding:4px 16px;animation:bump .6s ease .3s}

/* ending */
.end-hero{position:relative}
.end-title{font-size:28px;font-weight:900;text-align:center;line-height:1.25;margin-top:4px}
.end-sub{text-align:center;font-weight:900;color:var(--muted)}
.who{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:10px;text-align:center}
.tile .ic{font-size:26px}
.tile .lb{font-size:12px;font-weight:900;color:var(--muted)}
.tile .val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.tile .rk{font-size:12px;font-weight:900;margin-top:2px;min-height:15px}
.tile.wide{grid-column:1/-1}
.sect{padding:12px}
.sect h3{margin:0 0 8px;font-size:15px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-weight:900;font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.yc{flex:0 0 auto;width:44px;text-align:center;font-weight:900;font-size:11px;border:2px solid var(--ink);border-radius:10px;padding:3px 0;background:#fff}
.yc b{display:block;font-size:20px}
.yc.promo-y{background:#fff3bf}
.yc.away{background:#e9ecef;border-style:dashed}
.review{display:flex;align-items:center;gap:14px;border-top:2.5px dashed #ced4da;padding-top:10px;justify-content:center}
.stamp{flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:4px solid #e03131;color:#e03131;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);background:#fff5f5;animation:stamp .45s cubic-bezier(.3,1.6,.6,1) .15s backwards}
.stamp.gS{border-color:#f59f00;color:#f59f00;background:#fff9db;box-shadow:0 0 0 4px #ffe066}
.stamp.gC,.stamp.gD{border-color:#868e96;color:#868e96;background:#f1f3f5}
.rv{display:grid;gap:2px;font-weight:900;font-size:14px;min-width:0}
.rv-h{font-size:12px;color:var(--muted)}
.later{text-align:center;font-weight:900;font-size:16px;color:var(--muted)}
.screen.boomer .deltas{margin:4px 0}
.spin-fast{animation:spin 1.1s linear infinite}

/* leaderboard */
.lb-head{display:flex;align-items:center;justify-content:space-between}
.lb-head h2{margin:0;font-size:26px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:12px;padding:6px 2px;box-shadow:0 3px 0 var(--ink)}
.tab b{display:block;font-size:22px}
.tab.on{background:var(--yellow);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.lb-list{display:grid;gap:8px}
.lbi{display:grid;grid-template-columns:34px 44px 1fr auto;align-items:center;gap:8px;padding:6px 10px;animation:slideUp .3s ease backwards}
.lbi .rk{font-size:22px;font-weight:900;text-align:center}
.lbi .head{width:44px;height:44px;border:2px solid var(--ink);border-radius:12px;background:#e7f5ff}
.lbi .pn{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbi .gn{font-size:12px;font-weight:900;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.lbi .vv{font-weight:900;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbi.me{background:#fff3bf}
.lbi.top1{background:#fff9db}
.toggle{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.status{font-size:12px;font-weight:900;color:var(--muted);text-align:center}
.empty{padding:30px;text-align:center;font-weight:900;color:var(--muted)}

/* name modal */
.modal{padding:18px;width:100%;max-width:360px;display:grid;gap:12px;animation:popIn .35s cubic-bezier(.3,1.5,.6,1)}
.modal h2{margin:0;text-align:center}
.modal input{font:inherit;font-size:22px;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%;text-align:center;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;padding:10px 16px;border-radius:999px;z-index:99;animation:popIn .3s ease}

/* confetti */
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:confetti linear forwards}

/* svg animation classes */
.blink{animation:blink 1s steps(2) infinite}
.twinkle{animation:twinkle 1.8s ease-in-out infinite}
.glow{animation:glow 2s ease-in-out infinite}
.float{animation:floaty 2.4s ease-in-out infinite}
.fall{animation:fall 3.5s linear infinite}
.slide{animation:slide 6s linear infinite}
.spin-slow{animation:spin 10s linear infinite}
.flicker{animation:flicker .5s ease-in-out infinite alternate}
.steam path{animation:steam 2s ease-in-out infinite}
.wobble{animation:wobble 1.2s ease-in-out infinite}
.liftoff{animation:liftoff 2.4s ease-in-out infinite}
.orbit{animation:spin 6s linear infinite}
.fly{animation:fly 5s ease-in-out infinite}
.shake-soft{animation:shakeSoft .4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse-soft{animation:pulseSoft .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

let rnd = () => Math.random();

}
const ALL_EVENTS = () => EVENTS.concat((CONFIG.customEvents || []).map((e, i) => ({ id: 'custom' + i, ...e })));

/* ---------- roll a new grad ---------- */
function rollGrad() {

  const deg = wpick(DEGREES, d => d.w);
  let age = pick(deg.ages);
  const major = pick(MAJORS);
  const pers = pick(PERSONALITIES);
  const st = { tech: ri(20, 60), biz: ri(20, 60), comm: ri(20, 60), stamina: ri(25, 65), luck: ri(5, 95) };
  for (const [k, v] of Object.entries(major.mod)) st[k] += v;
  for (const [k, v] of Object.entries(pers.mod || {})) st[k] += v;
  if (deg.bonus) { st.tech += Math.round(deg.bonus * .6); st.biz += Math.round(deg.bonus * .6); }
  for (const k of STAT_KEYS) st[k] = clamp(st[k], 5, 95);
  const total = STAT_KEYS.reduce((a, k) => a + st[k], 0);
  let rarity = RARITIES[0];
  for (const r of RARITIES) if (total >= r.min) rarity = r;

  let fam = pick(nat.fam), giv = pick(g === 'm' ? nat.m : nat.f);
  let famJa = fam[1];
  if (nat.nikkei && rnd() < nat.nikkei) { const jf = pick(NATION.JP.fam); fam = [jf[0], jf[0]]; famJa = katakanaOf(jf[0]); }
  let name;
  if (nat.style === 'jp') name = { ja: `${fam[1]} ${giv[1]}`, en: `${giv[0]} ${fam[0]}` };
  else if (nat.style === 'cn') name = { ja: `${fam[1]} ${giv[1]}`, en: `${fam[0]} ${giv[0]}` };
  else if (nat.style === 'ff') name = { ja: `${fam[1]}・${giv[1]}`, en: `${fam[0]} ${giv[0]}` };
  else name = { ja: `${giv[1]}・${famJa}`, en: `${giv[0]} ${fam[0]}` };

  const look = {
    g, skin: pick(SKINS[nat.skin]), hair: pick(HAIRS[nat.hair]), hs: ri(0, 3),
    gl: rnd() < (pers.glasses || .22) ? 1 : 0, glAge: ri(42, 58),

const KATA = { Sato: 'サトウ', Suzuki: 'スズキ', Takahashi: 'タカハシ', Tanaka: 'タナカ', Ito: 'イトウ', Watanabe: 'ワタナベ', Yamamoto: 'ヤマモト', Nakamura: 'ナカムラ', Kobayashi: 'コバヤシ', Kato: 'カトウ', Yoshida: 'ヨシダ', Yamada: 'ヤマダ', Sasaki: 'ササキ', Matsumoto: 'マツモト', Inoue: 'イノウエ', Kimura: 'キムラ', Hayashi: 'ハヤシ', Shimizu: 'シミズ', Mori: 'モリ', Ikeda: 'イケダ' };

/* ---------- new career state ---------- */
function newState(grad, module) {

/* ---------- event selection ---------- */
function eventOk(S, e) {
  if (e.fixed || e.chainOnly || e.special) return false;
  if (e.minAge && S.age < e.minAge) return false;
  if (e.maxAge && S.age > e.maxAge) return false;
  if (e.minT && S.yearIdx < e.minT) return false;
  if (e.minLv != null && S.lv < e.minLv) return false;
  if (e.maxLv != null && S.lv > e.maxLv) return false;
  const last = S.used[e.id];
  if (last != null) {
    if (e.once) return false;
    if (S.yearIdx - last < (e.cool || 4)) return false;

  if (e.cond) { try { if (!e.cond(S)) return false; } catch (_) { return false; } }

}
function pickEvent(S) {

  if (S.yearIdx >= 2 && !S.used.magic && rnd() < 0.0012) return EVMAP.magic;
  if (S.yearIdx >= 2 && S.stress < 65 && rnd() < 0.1) return 'quiet';
  const pool = Object.values(EVMAP).filter(e => eventOk(S, e));

}
function markUsed(S, e) {

  if (e.scene === 'izakaya') S.cnt.drink = (S.cnt.drink || 0) + 1;

/* tokens like {client} are chosen once per event */
function rollTokens(S) {

/* ---------- checks ---------- */
function statVal(S, stat) {

  return ks.reduce((a, k) => a + (S[k] ?? 50), 0) / ks.length;
}

  const v = statVal(S, stat);
  const usesLuck = Array.isArray(stat) ? stat.includes('luck') : stat === 'luck';
  let p = 0.12 + v / 100 * 0.78 + (usesLuck ? 0 : (S.luck - 50) / 400) - Math.max(0, S.stress - 70) / 200;
  return clamp(p, 0.05, 0.95);
}
function choiceChance(S, ch) {

}

/* returns {success, fx, text, end, next, promote, roll, p} */
function resolveChoice(S, ev, ch, forced) {

  if (ch.run) { const r = ch.run(S) || {}; return { success: r.success ?? null, fx: r.fx || {}, text: r.text, end: r.end, next: r.next }; }
  if (ch.check) {

/* apply effects, return actual deltas */
const METERS = ['mot', 'stress', 'rep'];
/* card effects are scaled to how much time a card covers (half-year cards are gentler, 2-year cards stronger) */
const FX_SCALE = { mot: .65, stress: .65, rep: .5, tech: .6, biz: .6, comm: .6, stamina: .6, luck: .6 };
const scaleFx = (k, v, m = 1) => FX_SCALE[k] ? (Math.sign(v) * Math.max(1, Math.round(Math.abs(v) * FX_SCALE[k] * m))) : v;
function applyFx(S, fx, tag) {
  const out = [];
  for (let [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    v = scaleFx(k, v, S.fxMul || 1);
    if (k === 'stress' && v > 0) v = Math.round(v * S.stressMul * (tag === 'night' ? S.night : 1));
    if (k === 'rep' && v > 0) v = Math.round(v * S.repMul);
    if (METERS.includes(k) || STAT_KEYS.includes(k)) {
      const before = S[k];
      S[k] = clamp(Math.round(S[k] + v), 0, k === 'stress' || METERS.includes(k) ? 100 : 99);
      const d = Math.round(S[k] - before); if (d) out.push({ k, v: d });
    } else if (k === 'rev') { S.yearRev += v; out.push({ k, v }); }
    else if (k === 'sal') { S.sal = Math.max(200, S.sal + v); out.push({ k, v }); }
    else if (k === 'pay') { S.lifetime += v; out.push({ k, v }); }
    else if (k === 'kids') { S.kids += v; out.push({ k, v }); }
    else if (k === 'married') { S.married = true; out.push({ k, v: 1 }); }
    else { S[k] = (S[k] || 0) + v; }
  }
  return out;
}

function promote(S, to) {
  const from = S.lv, oldSal = S.sal;
  S.lv = to; S.yrsLv = 0;
  S.sal = Math.round(LEVELS[to].sal + Math.max(0, oldSal - LEVELS[from].sal) * 0.5);
  S.rep = clamp(S.rep - 20, 35, 100);
  S.mot = clamp(S.mot + 10, 0, 100);
  if (to > S.peak) { S.peak = to; S.peakYear = S.done; }
  if (S.log) S.log.push({ a: S.age, k: 'promo', lv: to, ic: to === 7 ? '👑' : '⬆️', t: { ja: `${LEVELS[to].ja}に昇進`, en: `Promoted to ${LEVELS[to].en}` } });
  return { from, to, oldSal, newSal: S.sal };
}

/* ---------- pacing: time speeds up with age (ジャネーの法則) ----------
   under 30: half-year cards (上期/下期) · 30–41: one card per year · 42+: one card per two years */
const FX_MUL = { 0.5: 1, 1: 1.5, 2: 2.0 };
function turnSpan(S) { if (S.age < 30) return 0.5; if (S.age < 42) return 1; return Math.max(1, Math.min(2, RETIRE() - S.age)); }
function beginTurn(S) { S.span = turnSpan(S); S.fxMul = FX_MUL[S.span]; return S.span; }
/* runs the year-end for every year the turn covers; returns the combined review */
function yearEnd(S, icon) {
  const n = Math.max(1, S.span || 1), agg = { rev: 0, bonus: 0, grade: 'B', promos: [], end: null, years: n };
  for (let i = 0; i < n; i++) {
    const r = endYear(S, icon);
    agg.rev += r.rev; agg.bonus += r.bonus; agg.grade = r.grade; if (r.promo) agg.promos.push(r.promo);
    if (r.end) { agg.end = r.end; break; }

  }

/* ---------- streak: 3+ successful rolls in a row pay a bonus ---------- */
function applyStreak(S, success) {

    S.streak = (S.streak || 0) + 1; S.maxStreak = Math.max(S.maxStreak || 0, S.streak);
    if (S.streak >= 3) return { n: S.streak, deltas: applyFx(S, { mot: 5, rep: 3 }) };
  } else if (success === false) S.streak = 0;
  return null;
}

/* ---------- career title (称号) ---------- */
function careerTitle(S, endId) {

}

/* ---------- year end ---------- */
function endYear(S, icon) {

  const aff = m.majors.includes(S.major) ? 6 : 0;
  let perf = (skill + aff - 50) / 100 + (S.mot - 50) / 220 - Math.max(0, S.stress - 75) / 90 + (rnd() - .5) * .15;
  perf = clamp(perf, -0.5, 0.7);
  const base = Math.round(LEVELS[S.lv].rev * (1 + perf));
  S.yearRev = Math.max(0, S.yearRev + base);
  S.revenue += S.yearRev;

  const before = { mot: S.mot, stress: S.stress, rep: S.rep };
  let dRep = perf * 12 + (rnd() * 6 - 3) + (50 - S.rep) * 0.08;
  if (dRep > 0) dRep *= S.repMul;
  S.rep = clamp(Math.round(S.rep + dRep), 0, 100);
  for (const k of ['tech', 'biz', 'comm']) S[k] = clamp(S[k] + Math.round(m.w[k] * 4 + rnd() * 1.2), 0, 99);
  S.stress = clamp(Math.round(S.stress - S.stress * 0.09 + (2 + S.lv * 1.1 - S.stamina / 40 + Math.max(0, S.age - 46) * 0.2) * S.stressMul), 0, 100);

  if (S.age >= 40) S.stamina = clamp(S.stamina - (S.age >= 55 ? 2 : 1), 0, 99);

  const grade = gp >= .33 ? 'S' : gp >= .13 ? 'A' : gp >= -.07 ? 'B' : gp >= -.27 ? 'C' : 'D';
  const bonus = Math.round(S.sal * { S: .45, A: .33, B: .22, C: .12, D: .04 }[grade]);
  S.lifetime += S.sal + bonus;
  S.happySum += S.mot;

  S.done += 1; S.yrsLv += 1;
  S.hist.push({ age: S.age, lv: S.lv, rev: S.yearRev, sal: S.sal, mot: Math.round(S.mot), icon: icon || '📅' });

  const res = { rev: S.yearRev, sal: S.sal, grade, bonus, drift: { mot: S.mot - before.mot, stress: S.stress - before.stress, rep: S.rep - before.rep }, promo: null, end: null };
  if (S.stress >= 100) res.end = 'burnout';
  else if (S.mot <= 0) res.end = 'quit';
  else if (S.rep <= 0) res.end = 'letgo';
  else {
    const L = LEVELS[S.lv];
    if (S.lv < 6 && S.yrsLv >= L.yrs && S.rep >= L.rep) {

      else res.noSlot = true; // no open position this year
    }

/* ---------- boomerang re-hire (出戻り): a failed startup or a bad new job brings them back once ---------- */
function tryBoomerang(S, endId) {

  if (endId === 'startup') { S.startupWin = rnd() < 0.28 + S.luck / 400; if (S.startupWin) return null; }
  else if (endId === 'poached') { if (rnd() >= 0.4) return null; }

  S.boomer = { kind: endId, yrs, from: S.age, tok: { ...S.tok } };
  S.log.push({ a: S.age, k: 'boomer', ic: '🪃', t: endId === 'startup' ? { ja: `起業して撤退…${yrs}年後に出戻り入社`, en: `Startup folded… back after ${yrs} yrs` } : { ja: `転職したが合わず…${yrs}年後に出戻り入社`, en: `Left for a rival… back after ${yrs} yrs` } });
  S.hist.push({ age: S.age, lv: S.lv, rev: 0, sal: 0, mot: Math.round(S.mot), icon: '🪃', away: true });
  S.age += yrs;
  S.rep = 45; S.yrsLv = 0;
  S.mot = clamp(S.mot + 15, 0, 100); S.stress = clamp(S.stress - 25, 0, 100);
  if (endId === 'startup') { S.biz = clamp(S.biz + 8, 0, 99); S.comm = clamp(S.comm + 5, 0, 99); }
  else { S.tech = clamp(S.tech + 6, 0, 99); S.biz = clamp(S.biz + 4, 0, 99); }

/* ---------- text & money helpers that work in both languages (used by the life report) ---------- */
function fillL(o, S, lang) {
  const str = typeof o === 'string' ? o : (o ? (o[lang] ?? o.en ?? '') : '');
  return String(str).replace(/\{(\w+)\}/g, (m, k) => { const v = (S.tok && S.tok[k]) || (k === 'company' ? CONFIG.company : null); return v ? (v[lang] ?? v.en) : m; });
}
const both = (o, S) => ({ ja: fillL(o, S, 'ja'), en: fillL(o, S, 'en') });
const joinT = (a, b) => ({ ja: `${a.ja}→${b.ja}`, en: `${a.en} → ${b.en}` });
function moneyL(man, lang) {
  const v = Math.round(man);
  if (lang === 'ja') {
    if (Math.abs(v) >= 10000) return (v / 10000).toFixed(Math.abs(v) >= 1000000 ? 0 : 1).replace(/\.0$/, '') + '億円';
    return v.toLocaleString('ja-JP') + '万円';
  }
  const yen = v * 10000;
  if (Math.abs(yen) >= 1e9) return '¥' + (yen / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
  if (Math.abs(yen) >= 1e8) return '¥' + Math.round(yen / 1e6) + 'M';
  if (Math.abs(yen) >= 1e6) return '¥' + (yen / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';

}

/* ---------- life log: what happened, for the life report ---------- */

const RP_FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif';
const rpF = (size, w = 900) => `${w} ${size}px ${RP_FONT}`;
const RAR_BG = { N: ['#f8f9fa', '#dee2e6'], R: ['#e7f5ff', '#a5d8ff'], SR: ['#f3f0ff', '#b197fc'], SSR: ['#fff9db', '#ffd43b'], UR: ['#ffc9c9', '#d0ebff'] };

function svgImg(svg, w, h) {
  const s = svg.replace(/<svg([^>]*)>/, (m, at) => {
    at = at.replace(/\s(width|height|class|style)="[^"]*"/g, '');
    if (!/xmlns=/.test(at)) at += ' xmlns="http://www.w3.org/2000/svg"';
    return `<svg${at} width="${w}" height="${h}">`;
  });
  return new Promise(res => {
    const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}
function rrect(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function cardBox(x, X, Y, w, h, fill = '#ffffff', r = 34) {
  rrect(x, X, Y + 10, w, h, r); x.fillStyle = OL; x.fill();
  rrect(x, X, Y, w, h, r); x.fillStyle = fill; x.fill(); x.lineWidth = 7; x.strokeStyle = OL; x.stroke();
}
function txt(x, s, X, Y, size, color = OL, align = 'left', weight = 900) { x.font = rpF(size, weight); x.fillStyle = color; x.textAlign = align; x.textBaseline = 'alphabetic'; x.fillText(s, X, Y); }
function fitTxt(x, s, X, Y, size, maxW, color = OL, align = 'left', weight = 900) {
  let sz = size; x.font = rpF(sz, weight);
  while (x.measureText(s).width > maxW && sz > 16) { sz -= 2; x.font = rpF(sz, weight); }
  txt(x, s, X, Y, sz, color, align, weight); return sz;
}
function outlined(x, s, X, Y, size, fill, stroke, lw, align = 'center') {
  x.font = rpF(size); x.textAlign = align; x.lineJoin = 'round'; x.lineWidth = lw; x.strokeStyle = stroke; x.strokeText(s, X, Y); x.fillStyle = fill; x.fillText(s, X, Y);
}
/* line wrapping that works for Japanese (per character) and English (per word) */
function wrapLines(x, s, maxW, size, weight = 700, maxLines = 99) {
  x.font = rpF(size, weight);
  const toks = String(s).match(/[　-ヿ㐀-鿿＀-￯]|[^\s　-ヿ㐀-鿿＀-￯]+\s*|\s+/g) || [];
  const lines = []; let cur = '';
  for (const t of toks) {
    if (/^[、。!?」』)ー…ー・,.!?]/.test(t)) { cur += t; continue; }   // no line may start with punctuation
    if (x.measureText(cur + t).width > maxW && cur.trim()) { lines.push(cur.trimEnd()); cur = t.trimStart(); }
    else cur += t;
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  if (lines.length > maxLines) { const keep = lines.slice(0, maxLines); keep[maxLines - 1] = keep[maxLines - 1].replace(/.$/, '…'); return keep; }
  return lines;
}
function pill(x, s, X, Y, size, bg, h = size * 1.6, align = 'left') {
  x.font = rpF(size); const w = x.measureText(s).width + size * 1.1;
  const X0 = align === 'center' ? X - w / 2 : align === 'right' ? X - w : X;
  rrect(x, X0, Y, w, h, h / 2); x.fillStyle = bg; x.fill(); x.lineWidth = 4; x.strokeStyle = OL; x.stroke();
  txt(x, s, X0 + w / 2, Y + h / 2 + size * .36, size, OL, 'center'); return w;
}
function radar(x, cx, cy, r, sc) {
  const n = CRIT_KEYS.length, pt = (i, rr) => [cx + rr * Math.sin(i * 2 * Math.PI / n), cy - rr * Math.cos(i * 2 * Math.PI / n)];
  for (const f of [.25, .5, .75, 1]) {
    x.beginPath(); CRIT_KEYS.forEach((k, i) => { const [px, py] = pt(i, r * f); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath();
    x.strokeStyle = f === 1 ? OL : '#dee2e6'; x.lineWidth = f === 1 ? 4 : 2; x.stroke();
  }
  CRIT_KEYS.forEach((k, i) => { const [px, py] = pt(i, r); x.beginPath(); x.moveTo(cx, cy); x.lineTo(px, py); x.strokeStyle = '#dee2e6'; x.lineWidth = 2; x.stroke(); });
  x.beginPath(); CRIT_KEYS.forEach((k, i) => { const [px, py] = pt(i, r * Math.max(.04, sc[k] / 100)); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath();
  x.fillStyle = 'rgba(255,93,115,.32)'; x.fill(); x.strokeStyle = '#ff5d73'; x.lineWidth = 6; x.lineJoin = 'round'; x.stroke();
  CRIT_KEYS.forEach((k, i) => { const [px, py] = pt(i, r * Math.max(.04, sc[k] / 100)); x.beginPath(); x.arc(px, py, 9, 0, 7); x.fillStyle = '#ff5d73'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke(); });
  CRIT_KEYS.forEach((k, i) => { const [px, py] = pt(i, r + 44); txt(x, AI_CRIT[k].icon, px, py + 16, 42, OL, 'center'); });
}

    if (!this.url()) return null;
    try { const r = await fetch(this.url() + (this.url().includes('?') ? '&' : '?') + 'id=' + encodeURIComponent(id)); const j = await r.json(); return (j.run && j.run.sum) || null; }
    catch (e) { return null; }
  },
  async fetchAll() {
    const trip = CONFIG.tripId || '';
    const localRuns = () => this.local().filter(r => (r.trip || '') === trip).map(normRun);
    if (!this.url()) return { runs: localRuns(), mode: 'local' };
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 10000);
      const r = await fetch(this.url() + (this.url().includes('?') ? '&' : '?') + 'trip=' + encodeURIComponent(trip), { signal: ctrl.signal });
      clearTimeout(to);
      const j = await r.json();
      const runs = (j.runs || []).map(normRun);
      const ids = new Set(runs.map(x => x.id));
      for (const p of this.pending()) if (!ids.has(p.id)) runs.push(normRun(p));
      return { runs, mode: 'online' };
    } catch (e) { return { runs: localRuns(), mode: 'offline' }; }
  },
};

/* ---------- year flow ---------- */
async function career() {
  let lastSpan = 0;
  while (true) {
    if (S.age >= RETIRE()) return endingScreen('retire');
    const span = beginTurn(S);
    if (lastSpan && span > lastSpan) await speedBanner(span);
    lastSpan = span;
    const halves = span === 0.5 ? 2 : 1;
    let away = false;
    for (let h = 0; h < halves && !away; h++) {
      S.half = span === 0.5 ? h : -1;
      const isLast = h === halves - 1;
      let ev = pickEvent(S);
      if (ev === 'quiet') {
        const ye = isLast ? yearEnd(S, '☕') : null;
        await quietYear(ye);
        if (ye && await afterReview(ye)) return;
        continue;
      }
      while (ev) {
        rollTokens(S);
        const { ch, res, deltas, streak } = await eventCard(ev);
        if (res.promote) res.promoInfo = promote(S, res.promote);
        if (res.end) {
          const bm = tryBoomerang(S, res.end);
          await outcome(res, deltas, null, bm ? 'next' : 'end', streak);
          if (bm) { await boomerangScreen(bm); away = true; break; }
          return endingScreen(res.end);
        }
        if (res.next) { await outcome(res, deltas, null, 'next', streak); ev = EVMAP[res.next]; continue; }
        const ye = isLast ? yearEnd(S, ch.icon) : null;
        await outcome(res, deltas, ye, ye ? (ye.end ? 'end' : 'year') : 'next', streak);
        if (res.promoInfo) await promoScreen(res.promoInfo);
        if (ye && await afterReview(ye)) return;
        ev = null;
      }
    }
  }
}

/* timing mini-game: the green zone is as wide as your success chance; tap to stop the needle inside it */
function timingGame(p) {
  const box = $('#choices'), z0 = Math.random() * (1 - p);
  box.innerHTML = `<div class="card gauge-box tapzone"><div class="gauge"><div class="zone" style="left:${(z0 * 100).toFixed(1)}%;width:${(p * 100).toFixed(1)}%"></div><div class="needle" id="needle"></div></div>
    <div class="gauge-lbl pulse">👆 ${tt(UI.tapStop)}</div><div class="status">🎲 ${Math.round(p * 100)}%</div></div>`;
  fitScreen();
  const nd = $('#needle'), period = 700 + p * 900, t0 = performance.now();
  let stopped = false, pos = 0, lastHalf = -1;
  return new Promise(res => {
    const finish = () => {
      if (stopped) return; stopped = true; document.removeEventListener('pointerdown', onTap, true);
      const ok = pos >= z0 * 100 - 1 && pos <= (z0 + p) * 100 + 1;
      nd.classList.add(ok ? 'hit' : 'miss'); if (!ok) box.firstElementChild.classList.add('shake-x');
      setTimeout(() => res(ok), 520);
    };
    const onTap = (e) => { e.preventDefault(); e.stopPropagation(); finish(); };
    const f = (now) => {
      if (stopped) return;
      const el = now - t0, u = (el % period) / period;
      pos = u < .5 ? u * 200 : (1 - u) * 200; nd.style.left = pos + '%';
      const hf = Math.floor(el / (period / 2)); if (hf !== lastHalf) { lastHalf = hf; SFX.tick(); }
      if (el > 4500) return finish();
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
    setTimeout(() => { if (!stopped) document.addEventListener('pointerdown', onTap, true); }, 200);
  });
}

async function outcome(res, deltas, ye, mode, streak) {
  if (streak) deltas = deltas.concat(streak.deltas);
  updateHUD(); floaters(deltas);
  if (res.success === true) SFX.ok(); else if (res.success === false) SFX.ng(); else SFX.coin();
  const resLine = res.success === true ? `<div class="res ok">✔ ${tt(UI.success)}</div>` : res.success === false ? `<div class="res ng">✘ ${tt(UI.fail)}</div>` : '';
  const txt = res.text ? `<div class="res-txt">${esc(T(res.text))}</div>` : '';
  const chips = deltas.map(deltaChip).join('');
  const sum = ye ? reviewHTML(ye) : '';
  const stk = streak ? `<div class="streak">🔥×${streak.n} ${tt(UI.streak)}</div>` : '';
  const lbl = mode === 'end' ? `🎬 ${tt(UI.toEnding)}` : mode === 'next' ? `▶ ${tt(UI.cont)}` : `▶ ${tt(UI.next)}`;
  $('#choices').innerHTML = `<div class="card outcome">${resLine}${stk}${txt}${chips ? `<div class="deltas">${chips}</div>` : ''}${sum}<button class="btn primary big" id="nx">${lbl}</button></div>`;
  fitScreen(); ensureVisible($('#nx'), true);
  await tap($('#nx')); SFX.tap();
}
async function quietYear(ye) {
  const picks = shuffle(QUIET).slice(0, 3);
  const el = screen(`${hudHTML()}
    <div class="scene">${sceneSVG('office', S, {})}<div class="yr-flag">${yearLabel()}</div></div>
    <div class="ev-title">☕ ${tt(UI.quiet)}</div>
    <div class="quiet-grid">${picks.map(q => `<div class="card qc"><b>${q.icon}</b><span class="n" data-n="${Math.round(ri(q.min, q.max) / 2)}">0</span><br><small>${tt(q)}</small></div>`).join('')}</div>
    <div class="card outcome">${ye ? reviewHTML(ye) : ''}
    <button class="btn primary big" id="nx">${ye && ye.end ? '🎬 ' + tt(UI.toEnding) : '⏩ ' + tt(UI.cont)}</button></div>`, 'year');
  ensureVisible($('#nx', el));
  const t0 = performance.now();
  const f = (now) => { const u = Math.min(1, (now - t0) / 900); $$('.qc .n', el).forEach(n => { n.textContent = Math.round(+n.dataset.n * u).toLocaleString(); }); if (u < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
  setTimeout(updateHUD, 200); SFX.coin();
  if (ye && (ye.end || ye.promos.length)) await tap($('#nx'));
  else await Promise.race([tap($('#nx')), wait(ye ? 3600 : 2600)]);
  SFX.tap();
}

    <div><span class="badge" style="background:${LEVELS[p.from].color}">${lvName(p.from)}</span></div><div class="arrow">⬇</div>

/* ---------- ending ---------- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function chartSVG() {
  const H = S.hist, n = H.length, W = 340, Ht = 150, ml = 46, mb = 20, mt = 10, mr = 6, ph = Ht - mt - mb;
  const top = niceMax(Math.max(1, ...H.map(h => h.rev))), bw = (W - ml - mr) / n;
  let s = '';
  for (let i = 0; i <= 2; i++) { const y = mt + ph * (1 - i / 2); s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" stroke="#e9ecef" stroke-width="1"/><text x="${ml - 5}" y="${y + 3.5}" font-size="10" text-anchor="end" fill="#6c727f" font-weight="700">${moneyShort(top * i / 2)}</text>`; }
  H.forEach((h, i) => {
    const bh = Math.max(1, ph * h.rev / top), x = ml + i * bw + 1, w = Math.max(1.5, bw - 2), y = mt + ph - bh, r = Math.min(4, w / 2, bh);
    s += `<path d="M${x},${y + bh} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + bh} Z" fill="${h.lv === 7 ? '#e8590c' : '#4dabf7'}" class="bar-r" data-i="${i}"/>`;
  });
  s += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ph}" y2="${mt + ph}" stroke="#2b2d42" stroke-width="1.5"/>`;
  const lbl = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  lbl.forEach(i => { s += `<text x="${ml + i * bw + bw / 2}" y="${Ht - 5}" font-size="10" text-anchor="middle" fill="#6c727f" font-weight="700">${ageStr(H[i].age)}</text>`; });
  H.forEach((h, i) => { s += `<rect class="hit" data-i="${i}" x="${ml + i * bw}" y="0" width="${bw}" height="${Ht}" fill="transparent"/>`; });
  return `<svg viewBox="0 0 ${W} ${Ht}" id="chartsvg">${s}</svg>`;
}
function bindChart() {
  const box = $('#chart'); if (!box) return;
  const tip = $('#tip'), svg = $('#chartsvg'), H = S.hist, n = H.length, W = 340, ml = 46, mr = 6, bw = (W - ml - mr) / n;
  const show = (e) => {
    const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W;
    const i = clamp(Math.floor((x - ml) / bw), 0, n - 1), h = H[i];
    $$('.bar-r', svg).forEach(b => b.style.opacity = +b.dataset.i === i ? 1 : .45);
    tip.style.display = 'block'; tip.style.left = ((ml + i * bw + bw / 2) / W * r.width) + 'px'; tip.style.top = '34px';
    tip.innerHTML = h.away ? `${ageStr(h.age)} · 🪃 ${tt(UI.away)}` : `${ageStr(h.age)} · ${lvName(h.lv, true)}<br>🏢 ${money(h.rev)} ${h.icon}`;
  };
  const hide = () => { tip.style.display = 'none'; $$('.bar-r', svg).forEach(b => b.style.opacity = 1); };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  svg.addEventListener('pointerleave', hide); svg.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') setTimeout(hide, 1400); });
}
function stripHTML(endId) {
  const H = S.hist;
  return H.map((h, i) => h.away ? `<div class="yc away">${h.age}<b>🪃</b>${tt(UI.away)}</div>`
    : `<div class="yc ${i > 0 && h.lv > H[i - 1].lv ? 'promo-y' : ''}">${h.age}<b>${h.icon}</b>${i > 0 && h.lv > H[i - 1].lv ? '⬆' : '&nbsp;'}</div>`).join('')
    + `<div class="yc promo-y">${S.age}<b>${ENDINGS[endId].icon}</b>🏁</div>`;
}
async function endingScreen(endId) {
  const E = ENDINGS[endId];
  if (endId === 'startup' && S.startupWin === undefined) S.startupWin = rnd() < 0.25 + S.luck / 400;
  const v = (endId === 'startup' && !S.startupWin) ? E.alt : E;
  const title = T(v.title), sub = T(v.sub);
  const acc = endId === 'retire' ? (S.peak === 7 ? 'crown bouquet' : 'bouquet') : '';
  const run = makeRunWithReport(S, endId, PLAYER);
  const ttl = careerTitle(S, endId);
  const el = screen(`<div class="scene end-hero">${sceneSVG(E.scene, S, { mood: 'happy', acc, deco: endId === 'lottery' ? 'money' : null })}</div>
    <div class="end-title">${E.icon} ${esc(title)}</div><div class="end-sub">${esc(sub)}</div>
    <div class="who">${flagSVG(S.nat, 15)} ${esc(tt(S.name))} · ${ageStr(S.age)}</div>
    <div class="card ttl-card"><div class="ttl-lb">🎖️ ${tt(UI.ttl)}</div><div class="ttl"><span class="ttl-ic">${ttl.icon}</span>${esc(tt(ttl))}</div></div>
    <button class="btn big yellow pulse" id="rpb">📜 ${tt(UI.reportBtn)}</button>
    <div class="tiles">
      <div class="card tile"><div class="ic">🕰️</div><div class="lb">${tt(UI.tenure)}</div><div class="val">${yearsStr(run.years)}</div><div class="rk" id="rk_tenure"></div></div>
      <div class="card tile"><div class="ic">🏢</div><div class="lb">${tt(UI.revenue)}</div><div class="val">${money(run.revenue)}</div><div class="rk" id="rk_revenue"></div></div>
      <div class="card tile"><div class="ic">👑</div><div class="lb">${tt(UI.peak)}</div><div class="val" style="font-size:18px"><span class="badge" style="background:${LEVELS[run.peak].color};font-size:15px">${lvName(run.peak, true)}</span></div><div class="rk" id="rk_peak"></div></div>
      <div class="card tile"><div class="ic">😊</div><div class="lb">${tt(UI.happy)}</div><div class="val">${run.happy}pt</div><div class="rk" id="rk_happy"></div></div>
      <div class="card tile wide"><div class="lb">👛 ${tt(UI.lifetime)}</div><div class="val">${money(S.lifetime)}</div></div>
    </div>
    ${S.hist.length ? `<div class="card sect"><h3>📈 ${tt(UI.career)}</h3><div class="chart" id="chart">${chartSVG()}<div class="tip" id="tip"></div></div></div>
    <div class="card sect"><h3>🧭 ${tt(UI.lifeline)}</h3><div class="strip">${stripHTML(endId)}</div></div>` : ''}
    <div class="status" id="sendst">⏳ ${tt(UI.loading)}</div>
    <button class="btn big primary pulse" id="again">🎰 ${tt(UI.again)}</button>
    <div class="row"><button class="btn yellow" id="lb">🏆 ${tt(UI.ranking)}</button><button class="btn" id="share">📤 ${tt(UI.share)}</button></div>
    <button class="btn small" id="home" style="align-self:center">🏠 ${tt(UI.home)}</button>`, 'ending');
  SFX.fan(); if (E.good) confetti(90);
  bindChart();
  $('#rpb').onclick = () => openReport(run);
  $('#again').onclick = () => { SFX.tap(); gachaScreen(); };
  $('#lb').onclick = () => { SFX.tap(); leaderboardScreen(run.id); };
  $('#home').onclick = () => { SFX.tap(); titleScreen(); };
  $('#share').onclick = () => {
    const text = L === 'ja'
      ? `【新卒ガチャ】${tt(S.name)}(${tt(NATION[S.nat])})は${yearsStr(run.years)}在籍、売上貢献${money(run.revenue)}、最高役職は${lvName(run.peak)}。称号「${tt(ttl)}」${ttl.icon} 結末:${title}${E.icon}`
      : `[Shinsotsu Gacha] ${tt(S.name)} (${tt(NATION[S.nat])}) stayed ${yearsStr(run.years)}, brought in ${money(run.revenue)}, peaked as ${lvName(run.peak)}. Title: "${tt(ttl)}" ${ttl.icon} Ending: ${title} ${E.icon}`;
    if (navigator.share) navigator.share({ title: tt(UI.title), text, url: location.href }).catch(() => { });
    else if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + location.href).then(() => toast(tt(UI.copied)), () => { });
  };
  const st = await LB.submit(run);
  const data = await LB.fetchAll();
  if (!$('#sendst')) return;
  $('#sendst').textContent = st === 'sent' ? '✅ ' + tt(UI.sent) : st === 'queued' ? '📴 ' + tt(UI.offline) : '📱 ' + tt(UI.localOnly);
  for (const b of BOARDS) {
    const list = rankList(data.runs, b, true), i = list.findIndex(r => pkey(r.player) === pkey(PLAYER));
    const elr = $('#rk_' + b.id); if (!elr || i < 0) continue;
    elr.innerHTML = `${i < 3 ? ['🥇', '🥈', '🥉'][i] : '🏅'} #${i + 1}/${list.length}${list[i].id === run.id ? ' 🆕' : ''}`;
  }
}

/* ---------- leaderboard screen ---------- */
async function leaderboardScreen(hl) {
  let tab = store.get('sg_tab', 'tenure'), data = { runs: [], mode: 'local' };
  screen(`<div class="lb-head"><button class="btn small" id="bk">◀ ${tt(UI.back)}</button><h2>🏆</h2><button class="btn small" id="rf">🔄 ${tt(UI.refresh)}</button></div>
    <div class="tabs">${BOARDS.map(b => `<button class="tab ${b.id === tab ? 'on' : ''}" data-t="${b.id}"><b>${b.icon}</b>${tt(b.lb)}</button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" id="best" checked> ${tt(UI.bestOnly)}</label>
    <div class="status" id="st">⏳ ${tt(UI.loading)}</div><div class="lb-list" id="list"></div><div class="status">${tt(UI.tapRow)}</div>`, 'lb');
  const draw = () => {
    const b = BOARDS.find(x => x.id === tab) || BOARDS[0];
    const list = rankList(data.runs, b, $('#best').checked).slice(0, 50);
    $('#list').innerHTML = list.length ? list.map((r, i) => {
      let head = '<svg class="head"></svg>';
      try { if (r.look && r.look.skin) head = headSVG(r.look, { age: r.look.age || 30, mood: 'happy' }); } catch (e) { }
      return `<div class="card lbi tap ${r.id === hl ? 'me' : ''} ${i === 0 ? 'top1' : ''}" data-i="${i}" style="animation-delay:${Math.min(i, 12) * .03}s">
        <div class="rk">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</div>${head}
        <div style="min-width:0"><div class="pn">${esc(r.player)}</div><div class="gn">${NATION[r.nat] ? flagSVG(r.nat, 10) : ''} ${(ENDINGS[r.ending] || {}).icon || ''} ${r.look && TITLE_MAP[r.look.ttl] ? TITLE_MAP[r.look.ttl].icon + ' ' + esc(tt(TITLE_MAP[r.look.ttl])) : esc(L === 'ja' ? (r.gradJa || '') : (r.gradEn || ''))}</div></div>
        <div class="vv">${b.val(r)}${b.sub ? `<div class="gn" style="justify-content:flex-end">${b.sub(r)}</div>` : ''}</div></div>`;
    }).join('') : `<div class="card empty">${tt(UI.noRuns)}</div>`;
    $$('.lbi', $('#list')).forEach(row => { row.onclick = () => openReport(list[+row.dataset.i]); });
  };
  const load = async () => {
    $('#st').textContent = '⏳ ' + tt(UI.loading);
    data = await LB.fetchAll();
    $('#st').textContent = data.mode === 'online' ? `🌐 ${tt(UI.online)} · ${data.runs.length}` : data.mode === 'local' ? `📱 ${tt(UI.localOnly)}` : `📴 ${tt(UI.offline)}`;
    draw();
  };
  $$('.tab').forEach(t => t.onclick = () => { tab = t.dataset.t; store.set('sg_tab', tab); $$('.tab').forEach(x => x.classList.toggle('on', x === t)); SFX.tap(); draw(); });
  $('#best').onchange = draw;
  $('#bk').onclick = () => { SFX.tap(); titleScreen(); };
  $('#rf').onclick = () => { SFX.tap(); load(); };
  load();
}
